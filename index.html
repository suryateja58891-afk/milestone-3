<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple task list that saves your tasks in your browser." />
  <title>My Small Task List</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="eyebrow">MY PRODUCTIVITY SPACE</div>
      <h1>Small steps.<br><span>Big progress.</span></h1>
      <p class="subtitle">Add your tasks, keep track of them, and make today count.</p>
    </header>

    <section class="task-card" aria-label="Task list">
      <form id="task-form" class="task-form">
        <label class="sr-only" for="task-input">Enter a new task</label>
        <input id="task-input" type="text" maxlength="120" placeholder="What do you need to do?" autocomplete="off" required />
        <button type="submit" class="add-button">Add task <span aria-hidden="true">+</span></button>
      </form>

      <div class="toolbar">
        <div>
          <h2>Your tasks</h2>
          <p id="task-count" class="task-count" aria-live="polite">0 tasks remaining</p>
        </div>
        <button id="clear-completed" class="clear-button" type="button">Clear completed</button>
      </div>

      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-button active" data-filter="all" type="button">All</button>
        <button class="filter-button" data-filter="active" type="button">Active</button>
        <button class="filter-button" data-filter="completed" type="button">Completed</button>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state">No tasks yet. Add your first task above!</p>
      <footer class="card-footer"><span class="save-dot"></span> Your tasks are saved automatically on this device.</footer>
    </section>
    <p class="page-note">Keep going — one task at a time.</p>
  </main>
</body>
</html>
